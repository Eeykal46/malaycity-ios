# MALAYCITY iOS - spec XcodeGen (27 Okt 2026).
# Projek .xcodeproj DIJANA dari fail ini (tiada Mac diperlukan): GitHub Actions jalankan
# `xcodegen generate` -> `xcodebuild`. Sumber UI = assets launcher Android yang SAMA
# (satu sumber kebenaran, tiada salinan berasingan):
#   ../mobile/app/src/main/assets/launcher  ->  dilampirkan sebagai folder reference
#   (masuk bundle sebagai "launcher/index.html", dibuka oleh WKWebView).
name: McLauncher

options:
  bundleIdPrefix: com.malaycity
  createIntermediateGroups: true
  developmentLanguage: ms
  deploymentTarget:
    iOS: "17.0"
  # Sumber UI: satu sumber kebenaran = index.html Android.
  #   Repo PENUH  : mobile/.../launcher wujud -> disalin semula setiap generate.
  #   Repo SLIM   : folder itu tiada -> guna `launcher/` yg sudah dikomit (salinan sama).
  # PENTING: `ios/launcher/` dan `mobile/.../launcher/` MESTI kekal sama.
  # Kalau kau ubah salah satu, salin ke yang lain (atau jalankan SIMPAN_IOS.bat
  # yang menyemak ini). `test -f` memastikan build GAGAL awal kalau HTML hilang.
  preGenCommand: "sh -c 'set -e; D=../mobile/app/src/main/assets/launcher; if [ -f \"$D/index.html\" ]; then rm -rf launcher; cp -R \"$D\" launcher; fi; test -f launcher/index.html'"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"        # iPhone sahaja (iPad tak diuji)
    CLANG_ENABLE_MODULES: YES

targets:
  McLauncher:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: McLauncher
      # folder reference: isi kandungan disalin apa adanya ke bundle sebagai "launcher/..."
      # (`launcher/` = salinan index.html Android, dibuat oleh preGenCommand di atas)
      - path: launcher
        type: folder
      # Fasa 3: lapisan ganti Android -> iOS.
      # enjin/ = kod kita sendiri (shim ringkas, bridging header)
      - path: enjin
      # Kod Husk 3.1 (GPL-2.0): translation layer penuh.
      #   husk/tl-next/  - 112 fail termasuk husk-tl-gtasa.c (driver GTA SA)
      #   husk/ios-jit/  - JIT, audio, display
      #   husk/angle/    - libANGLE-shared.dylib (dibina oleh angle.yml)
      # Lihat KOD_PIHAK_KETIGA.md.
      - path: husk
        excludes:
          - "LICENSE-HUSK-GPL2.txt"
    settings:
      base:
        PRODUCT_NAME: McLauncher
        PRODUCT_BUNDLE_IDENTIFIER: com.malaycity.mobile.ios
        INFOPLIST_FILE: McLauncher-Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_ENABLE_OBJC_ARC: YES
        # Dedahkan API C Husk kepada Swift
        SWIFT_OBJC_BRIDGING_HEADER: enjin/McLauncher-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/husk/tl-next $(SRCROOT)/husk/ios-jit $(SRCROOT)/enjin"
        # Simbol mesti kelihatan (enjin dimuat melalui rujukan langsung)
        OTHER_CFLAGS: "$(inherited) -fvisibility=default"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -fvisibility=default"
        GCC_WARN_UNUSED_VARIABLE: NO
    dependencies:
      - sdk: OpenGLES.framework
      - sdk: GLKit.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework

schemes:
  McLauncher:
    build:
      targets:
        McLauncher: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
